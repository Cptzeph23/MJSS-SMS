<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:560px"><section class="card shadow-sm border-0"><div class="card-body p-4 p-md-5"><h1 class="h4">Set your password</h1><p class="text-muted">Choose a new password to continue.</p>
{% if errors %}<div class="alert alert-danger"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" id="password-change-form">{% csrf_token %}
<label class="form-label" for="new-password">New password</label><div class="input-group mb-3"><input class="form-control" id="new-password" name="new_password" type="password" autocomplete="new-password" required><button class="btn btn-outline-secondary" type="button" data-toggle-password="new-password" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<label class="form-label" for="confirm-password">Confirm password</label><div class="input-group mb-4"><input class="form-control" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required><button class="btn btn-outline-secondary" type="button" data-toggle-password="confirm-password" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<button class="btn btn-primary w-100" id="password-submit">Save password</button></form></div></section></main>
<script>
document.querySelectorAll("[data-toggle-password]").forEach(button => button.addEventListener("click", () => { const input=document.getElementById(button.dataset.togglePassword); input.type=input.type==="password"?"text":"password"; button.setAttribute("aria-label",input.type==="password"?"Show password":"Hide password"); button.innerHTML=input.type==="password"?'<i class="bi bi-eye"></i>':'<i class="bi bi-eye-slash"></i>'; }));
document.getElementById("password-change-form").addEventListener("submit", event => { const a=document.getElementById("new-password"), b=document.getElementById("confirm-password"); if(a.value!==b.value){event.preventDefault(); b.setCustomValidity("Passwords do not match."); b.reportValidity();}else{b.setCustomValidity(""); const button=document.getElementById("password-submit"); button.disabled=true; button.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Saving…';} });
document.getElementById("confirm-password").addEventListener("input", event => event.target.setCustomValidity(""));
</script></body></html>
