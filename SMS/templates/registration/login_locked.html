<!-- Absolute path: SMS/templates/registration/login_locked.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Attempts — SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 text-center" style="width: 24rem;">
        <i class="bi bi-shield-exclamation fs-1 text-danger"></i>
        <h5 class="mt-3">Too many failed login attempts</h5>
        <p class="text-muted">
            For security, sign-in from this location is temporarily paused.
            Please try again in about {{ retry_after_seconds|default:300|floatformat:0 }} seconds.
        </p>
        <a href="{% url 'dashboard:login' %}" class="btn btn-outline-secondary">Back to Login</a>
    </div>
</div>
</body>
</html>
